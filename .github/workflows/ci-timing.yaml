name: CI timing diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Environment
        run: |
          echo "node $(node -v) npm $(npm -v)"
          npm config get min-release-age
          echo "registry latency:"; curl -s -o /dev/null -w 'dns=%{time_namelookup}s connect=%{time_connect}s total=%{time_total}s\n' https://registry.npmjs.org/typescript-eslint
      - name: Timed cold installs
        run: |
          run() {
            label="$1"; shift
            rm -rf node_modules; cache=$(mktemp -d)
            start=$(date +%s.%N)
            npm ci "$@" --cache "$cache" --no-audit --no-fund --loglevel=http > "/tmp/$label.log" 2>&1 || echo "FAILED $label"
            end=$(date +%s.%N)
            total=$(grep -c ' http fetch GET ' "/tmp/$label.log" || true)
            tarballs=$(grep ' http fetch GET ' "/tmp/$label.log" | grep -c '/-/' || true)
            printf '%-34s %6.1fs  GETs=%s tarballs=%s packuments=%s\n' "$label" "$(echo "$end - $start" | bc)" "$total" "$tarballs" "$((total - tarballs))"
          }
          exact() {
            label="$1"; shift
            rm -rf node_modules
            start=$(date +%s.%N)
            npm ci --ignore-scripts "$@" --loglevel=http > "/tmp/$label.log" 2>&1 || echo "FAILED $label"
            end=$(date +%s.%N)
            printf '%-34s %6.1fs\n' "$label" "$(echo "$end - $start" | bc)"
            grep -E 'http fetch (POST|GET [0-9]+ https://registry.npmjs.org/-/npm)' "/tmp/$label.log" | sed -E 's/^npm http //' | cut -c1-140
          }
          exact E-exact-ci-command
          exact F-exact-plus-no-audit --no-audit
          exact G-exact-plus-no-fund --no-fund
