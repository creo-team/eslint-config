name: CI timing diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Environment
        run: |
          echo "node $(node -v) npm $(npm -v)"
          npm config get min-release-age
          echo "registry latency:"; curl -s -o /dev/null -w 'dns=%{time_namelookup}s connect=%{time_connect}s total=%{time_total}s\n' https://registry.npmjs.org/typescript-eslint
      - name: Timed cold installs
        run: |
          run() {
            label="$1"; shift
            rm -rf node_modules; cache=$(mktemp -d)
            start=$(date +%s.%N)
            npm ci "$@" --cache "$cache" --no-audit --no-fund --loglevel=http > "/tmp/$label.log" 2>&1 || echo "FAILED $label"
            end=$(date +%s.%N)
            total=$(grep -c ' http fetch GET ' "/tmp/$label.log" || true)
            tarballs=$(grep ' http fetch GET ' "/tmp/$label.log" | grep -c '/-/' || true)
            printf '%-34s %6.1fs  GETs=%s tarballs=%s packuments=%s\n' "$label" "$(echo "$end - $start" | bc)" "$total" "$tarballs" "$((total - tarballs))"
          }
          run A-committed-cooldown7 --ignore-scripts
          run B-cooldown-disabled --ignore-scripts --min-release-age=0
          run C-no-ignore-scripts
          run D-committed-again --ignore-scripts
          echo "--- slowest requests in A:"
          grep ' http fetch GET ' /tmp/A-committed-cooldown7.log | sed -E 's/.* http fetch GET ([0-9]+) ([^ ]+) ([0-9]+)ms.*/\3ms \1 \2/' | sort -rn | head -5
